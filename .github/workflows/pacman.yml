name: Update public contribution arcade

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pacman.yml'
      - 'scripts/contributions.py'

permissions:
  contents: write

concurrency:
  group: public-contribution-arcade
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fetch and validate the public profile calendar
        run: python3 scripts/contributions.py
      - name: Publish the shared calendar snapshot and SVGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cd dist
          git init -b output
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contribution-calendar.svg pacman-contribution-graph.svg contributions.json
          git commit -m 'Refresh validated public contribution calendar'
          git push --force "https://x-access-token:$GH_TOKEN@github.com/$REPOSITORY.git" HEAD:output
